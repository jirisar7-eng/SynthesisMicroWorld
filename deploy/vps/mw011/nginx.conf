server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    # The simulated world stays inside the private Docker bridge.
    # Only the VPS loopback binds this web service; NO public Caddy route.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        set $world_http http://sim:8081;
        proxy_pass $world_http/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location ~ ^/api/(world|status|events)$ {
        set $world_http http://sim:8081;
        proxy_pass $world_http$request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_buffering off;
        gzip on;
        gzip_types application/json;
        client_max_body_size 1k;
        limit_except GET { deny all; }
    }

    # Do not use ^~ here: the specific read-only regex endpoints must win.
    location /api/ { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    location ^~ /terrain/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
