name: MW-012 Private VPS Full-Stack Smoke
on:
  push:
    branches:
      - feature/mw-012-vps-unified-preview
  pull_request:
    paths:
      - 'deploy/vps/mw011/**'
      - 'server/**'
      - 'src/world-save.js'
      - 'src/main.js'
      - 'tests/mw012-server-mirror.test.js'
      - '.github/workflows/mw012-vps-smoke.yml'
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax
        run: |
          bash -n deploy/vps/mw011/preflight.sh
          bash -n deploy/vps/mw011/apply.sh
      - name: Validate strictly loopback topology
        env:
          MW011_RELEASE: ci
          MW011_HOST_PORT: "18585"
        run: |
          docker compose -f deploy/vps/mw011/compose.yaml config -q
          docker compose -f deploy/vps/mw011/compose.yaml config --format json |
            python3 -c 'import json,sys; p=json.load(sys.stdin); w=p["services"]["web"]; port=w["ports"][0]; assert p["name"]=="microworld011_preview"; assert set(p["services"])=={"sim","web"}; assert len(w["ports"])==1; assert port["host_ip"]=="127.0.0.1" and int(port["published"])==18585; assert not p["services"]["sim"].get("ports"); print("MW012_LOOPBACK_ONLY=PASS")'
      - name: Build exact frontend and isolated Node server images
        env:
          MW011_RELEASE: ci
          MW011_HOST_PORT: "18585"
        run: |
          docker compose -f deploy/vps/mw011/compose.yaml build sim web
      - name: Verify 3D routes, private API, persistence, restart and read-only methods
        env:
          MW011_RELEASE: ci
          MW011_HOST_PORT: "18585"
        run: |
          set -euo pipefail
          stack=(docker compose -f deploy/vps/mw011/compose.yaml)
          trap '"${stack[@]}" down >/dev/null 2>&1 || true' EXIT
          "${stack[@]}" up -d --no-build sim web
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18585/healthz | grep -Fxq ok; then break; fi
            sleep 2
          done
          for route in svet prehled lide; do
            curl -fsS --max-time 7 -o /dev/null "http://127.0.0.1:18585/${route}/"
          done
          curl -fsS http://127.0.0.1:18585/api/world |
            node -e 'let s=""; process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const o=JSON.parse(s); if(o.version!==1||o.state.agents.length!==30||o.state.islands.predators.length!==3||!o.state.material)process.exit(1)})'
          before="$(curl -fsS http://127.0.0.1:18585/api/status)"
          sleep 2
          after="$(curl -fsS http://127.0.0.1:18585/api/status)"
          node -e 'const a=JSON.parse(process.argv[1]),b=JSON.parse(process.argv[2]); if(b.seconds<=a.seconds||b.population.living!==30)process.exit(1)' "$before" "$after"
          "${stack[@]}" stop sim
          "${stack[@]}" start sim
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18585/healthz >/dev/null; then break; fi
            sleep 2
          done
          restored="$(curl -fsS http://127.0.0.1:18585/api/status)"
          node -e 'const x=JSON.parse(process.argv[1]),r=JSON.parse(process.argv[2]);if(!r.restored||r.seconds<x.seconds||r.population.living!==30)process.exit(1)' "$after" "$restored"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18585/api/status)"
          test "$code" != 200
          "${stack[@]}" ps
          echo 'MW012_VPS_SMOKE_PASS: frontend + 30-person server + read-only API + persistent restart, port 18585 loopback only'
