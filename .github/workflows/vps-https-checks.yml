name: MicroWorld Private HTTPS Deployment Checks
on:
  push:
    branches:
      - deploy/vps-https-002
  pull_request:
    paths:
      - 'deploy/vps/**'
      - '.github/workflows/vps-https-checks.yml'
permissions:
  contents: read
jobs:
  https-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate HTTPS scripts
        run: |
          set -euo pipefail
          bash -n deploy/vps/https-preflight.sh
          bash -n deploy/vps/https-apply.sh
          grep -F '127.0.0.1:' deploy/vps/compose.yaml
          ! grep -E '0\.0\.0\.0:443|0\.0\.0\.0:80' deploy/vps/compose.https.yaml
      - name: Validate existing Caddy edge network overlay
        env:
          MICROWORLD_RELEASE: test123
          MICROWORLD_PORT: "18583"
        run: |
          set -euo pipefail
          docker network create synthesis-edge-net
          docker compose --project-name microworld_private \
            -f deploy/vps/compose.yaml -f deploy/vps/compose.https.yaml config -q
          docker compose --project-name microworld_private \
            -f deploy/vps/compose.yaml -f deploy/vps/compose.https.yaml config |
            grep -F 'synthesis-edge-net'
      - name: Validate Caddy basic-auth syntax with synthetic credentials
        run: |
          set -euo pipefail
          HASH="$(printf '%s\n' 'ci-test-password-do-not-use' |
            docker run --rm -i caddy:2-alpine caddy hash-password --algorithm bcrypt)"
          cat > "$RUNNER_TEMP/Caddyfile" <<EOF
          :8089 {
              basic_auth {
                  owner $HASH
              }
              reverse_proxy microworld-web:8080 {
                  header_up -Authorization
              }
          }
          EOF
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          echo 'MW_HTTPS_PACKAGE_PASS: Compose overlay, basic-auth parser and guard scripts'
