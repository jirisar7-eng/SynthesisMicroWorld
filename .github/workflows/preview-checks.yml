name: MicroWorld Preview Checks
on:
  push:
    branches:
      - feature/mw-004-living-world
      - feature/mw-005-knowledge
      - feature/mw-006-material-life
      - feature/mw-006b-living-settlement
  pull_request:
    branches:
      - feature/mw-001-first-life
      - feature/mw-004-living-world
      - feature/mw-005-knowledge
      - feature/mw-006-material-life
      - main
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Autonomy, material transport and living world tests
        run: npm test
      - name: Production build
        run: npm run build
