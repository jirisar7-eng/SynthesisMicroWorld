name: MicroWorld GOD-001 Checks
on:
  push:
    branches:
      - feature/mw-god-001
  pull_request:
    branches:
      - feature/mw-012-vps-unified-preview
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate god mechanics and integration
        run: npm test
      - name: Build offline production bundle
        run: npm run build:offline
